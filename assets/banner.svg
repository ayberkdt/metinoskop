<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Metinoskop</title>
  <desc id="desc">Solda Metinoskop adı ve "Türkçe metin için yazım ve düzenleme skill'i" satırı. Sağda bir belge sayfası: büyüteç camının dışında satırlar parçalı ve soluk, camın içinde düzgün ve koyu.</desc>
  <style>
    .bg { fill: #FAF7F2; }
    .page { fill: #FFFFFF; stroke: #E4DCCF; }
    .ink { fill: #1F1D24; }
    .sub { fill: #5B5663; }
    .noise { stroke: #D6CDBF; }
    .clean { stroke: #2A2730; }
    .lens { fill: #FFFFFF; }
    .accent { stroke: #C8463D; }
    text { font-family: -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16151B; }
      .page { fill: #1E1D25; stroke: #34323D; }
      .ink { fill: #F3EEE6; }
      .sub { fill: #B4ADA3; }
      .noise { stroke: #46434F; }
      .clean { stroke: #EDE7DE; }
      .lens { fill: #272630; }
      .accent { stroke: #EE7A70; }
    }
  </style>
  <defs>
    <clipPath id="lens-inside">
      <circle cx="944" cy="158" r="80"/>
    </clipPath>
    <mask id="lens-outside">
      <rect width="1280" height="320" fill="#fff"/>
      <circle cx="944" cy="158" r="92" fill="#000"/>
    </mask>
  </defs>

  <rect class="bg" width="1280" height="320" rx="24"/>

  <!-- Ad ve tanım -->
  <text class="ink" x="88" y="170" font-size="88" font-weight="700" letter-spacing="-2">Metinoskop</text>
  <text class="sub" x="92" y="224" font-size="28">Türkçe metin için yazım ve düzenleme skill'i</text>

  <!-- Belge sayfası -->
  <rect class="page" x="768" y="40" width="432" height="240" rx="14" stroke-width="2"/>

  <!-- Camın dışında: parçalı, soluk satırlar -->
  <g class="noise" stroke-width="7" stroke-linecap="round" fill="none" mask="url(#lens-outside)">
    <path d="M800 76h38 M852 76h16 M882 76h54 M950 76h12 M976 76h62 M1052 76h22 M1088 76h40 M1142 76h26"/>
    <path d="M800 102h26 M840 102h58 M912 102h12 M938 102h48 M1000 102h18 M1032 102h60 M1106 102h62"/>
    <path d="M800 128h50 M864 128h14 M892 128h40 M946 128h28 M988 128h12 M1014 128h54 M1082 128h86"/>
    <path d="M800 154h18 M832 154h64 M910 154h22 M946 154h36 M996 154h60 M1070 154h14 M1098 154h70"/>
    <path d="M800 180h44 M858 180h30 M902 180h14 M930 180h56 M1000 180h40 M1054 180h18 M1086 180h82"/>
    <path d="M800 206h60 M874 206h12 M900 206h46 M960 206h24 M998 206h52 M1064 206h34 M1112 206h56"/>
    <path d="M800 232h34 M848 232h50 M912 232h18 M944 232h44 M1002 232h30"/>
  </g>

  <!-- Büyüteç: camın içinde aynı satırlar düzgün -->
  <circle class="lens" cx="944" cy="158" r="86"/>
  <g class="clean" stroke-width="7" stroke-linecap="round" fill="none" clip-path="url(#lens-inside)">
    <path d="M800 102h368"/>
    <path d="M800 128h368"/>
    <path d="M800 154h368"/>
    <path d="M800 180h368"/>
    <path d="M800 206h170"/>
  </g>
  <circle class="accent" cx="944" cy="158" r="86" stroke-width="9" fill="none"/>
  <path class="accent" d="M1006 220l50 50" stroke-width="16" stroke-linecap="round" fill="none"/>
</svg>
